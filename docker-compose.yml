version: "3.9"

services:
  repocket-mihomo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repocket-mihomo
    restart: unless-stopped
    ports:
      - "7890:7890"
      - "7891:7891"
      - "9090:9090"
    environment:
      CLASH_SUB_BASE64: "${CLASH_SUB_BASE64:-}"
      RP_EMAIL: "${RP_EMAIL:-}"
      RP_API_KEY: "${RP_API_KEY:-}"
      HTTP_PROXY: "http://127.0.0.1:7890"
      HTTPS_PROXY: "http://127.0.0.1:7890"
      http_proxy: "http://127.0.0.1:7890"
      https_proxy: "http://127.0.0.1:7890"
      ALL_PROXY: "socks5://127.0.0.1:7891"
      NO_PROXY: "localhost,127.0.0.1"
    network_mode: bridge
