services:
  repocket-mihomo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repocket-mihomo
    restart: unless-stopped
    environment:
      RP_EMAIL: ${RP_EMAIL:?set RP_EMAIL in .env}
      RP_API_KEY: ${RP_API_KEY:?set RP_API_KEY in .env}
      CONFIG_YAML_B64: ${CONFIG_YAML_B64:?set CONFIG_YAML_B64 in .env}
      MIHOMO_HTTP_PROXY: ${MIHOMO_HTTP_PROXY:-http://127.0.0.1:7890}
      MIHOMO_SOCKS_PROXY: ${MIHOMO_SOCKS_PROXY:-socks5h://127.0.0.1:7890}
    ports:
      - "9090:9090"
